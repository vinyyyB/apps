<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta id="meta-theme-color" name="theme-color" content="#1e2130">
<title>💸 Controle de Grana</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    /* Variáveis base - serão sobrescritas pelo JS */
    --bg: #0f1117;
    --surface: #181b23;
    --surface2: #1e2130;
    --border: #2a2f42;
    --accent: #7c5cfc;
    --accent2: #00d4aa;
    --danger: #ff4d6a;
    --warn: #ffb547;
    --ok: #00d4aa;
    --muted: #565f7e;
    --text: #e2e5f0;
    --text2: #9aa3c2;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    min-height: 100vh;
    transition: background-color 0.3s ease;
  }

  /* HEADER */
  header {
    background: var(--surface2); /* Fundo sólido adaptável ao tema */
    border-bottom: 1px solid var(--border);
    padding: 20px 24px 0;
    position: sticky;
    top: 0;
    z-index: 100;
    transition: background-color 0.3s ease;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
    flex-wrap: wrap; 
    gap: 16px;
  }

  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  @media (max-width: 600px) {
    .header-actions {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .header-actions .btn-primary { grid-column: span 2; }
  }

  .logo {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo span {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .logo i { color: var(--accent2); }

  /* TABS DE MÊS */
  .month-tabs {
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding-bottom: 0;
    scrollbar-width: none;
  }
  .month-tabs::-webkit-scrollbar { display: none; }

  .month-tab {
    padding: 8px 18px;
    border-radius: 8px 8px 0 0;
    border: 1px solid transparent;
    border-bottom: none;
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    transition: all .15s;
    position: relative;
    top: 1px;
  }
  .month-tab:hover { color: var(--text); background: var(--surface); }
  .month-tab.active {
	
	.month-tab { cursor: grab; }
	.month-tab:active { cursor: grabbing; }
	.month-tab.dragging { opacity: 0.5; background: var(--surface2); border: 1px dashed var(--muted); }
    background: var(--bg); /* Tab ativa se mescla ao fundo */
    color: var(--text);
    border-color: var(--border);
    border-bottom-color: var(--bg);
  }

/* SIDEBAR DRAWER (OFF-CANVAS) */
  .sidebar-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 998; backdrop-filter: blur(2px); opacity: 0; transition: opacity 0.3s;
  }
  .sidebar-overlay.open { display: block; opacity: 1; }

  .sidebar-drawer {
    position: fixed; top: 0; left: -320px; width: 280px; height: 100vh;
    background: var(--surface2); border-right: 1px solid var(--border);
    z-index: 999; transition: left 0.3s ease; overflow-y: auto;
    display: flex; flex-direction: column; box-shadow: 4px 0 15px rgba(0,0,0,0.5);
  }
  .sidebar-drawer.open { left: 0; }
  
  .sidebar-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px; border-bottom: 1px solid var(--border);
  }
  .sidebar-header h4 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  
  .sidebar-section-title { font-size: 11px; text-transform: uppercase; color: var(--muted); padding: 20px 16px 8px; font-weight: 600; }
  
  .month-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; margin: 0 8px 4px; border-radius: 8px;
    cursor: grab; color: var(--text2); transition: 0.2s;
    font-size: 13px; font-weight: 500;
  }
  .month-item:active { cursor: grabbing; }
  .month-item:hover { background: var(--surface); color: var(--text); }
  .month-item.active { background: var(--accent); color: var(--btn-text, #fff); }
  .month-item.active { background: var(--accent); color: var(--btn-text, #fff); }
  .month-item.archived { opacity: 0.5; filter: grayscale(1); cursor: pointer; }
  
  .btn-archive { background: transparent; border: none; color: inherit; cursor: pointer; padding: 6px; border-radius: 6px; font-size: 14px; opacity: 0.7; transition: 0.2s; }
  .btn-archive:hover { opacity: 1; background: rgba(255,255,255,0.1); }
  .dragging { opacity: 0.4; background: var(--surface); border: 1px dashed var(--muted); }
  
  /* MAIN */
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  /* DASHBOARD (Cards + Chart) */
  .dashboard-layout {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 28px;
  }
  .cards-column {
    flex: 1 1 350px;
  }
  .chart-column {
    flex: 0 0 350px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 235px;
    transition: all 0.3s ease;
  }
  @media (max-width: 850px) {
    .chart-column { flex: 1 1 100%; min-height: 260px; }
  }

  /* RESUMO CARDS */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 8px;
    margin-bottom: 12px;
  }

  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 8px;
    transition: all 0.3s ease;
  }

  .summary-card .label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--muted);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .summary-card .value {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
  }

  .summary-card.green .value { color: var(--ok); }
  .summary-card.red .value { color: var(--danger); }
  .summary-card.purple .value { color: var(--accent); }
  .summary-card.yellow .value { color: var(--warn); }
  .summary-card.blue .value { color: #5ca1fc; }

  /* CARD EM DESTAQUE (SOBRA) */
  .summary-highlight {
    display: flex;
    width: 100%;
    gap: 12px;
  }
  .summary-highlight .summary-card {
    flex: 1;
    min-width: 0;
    text-align: center;
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 20px;
  }
  .summary-highlight .summary-card .label { font-size: 12px; }
  .summary-highlight .summary-card .value { font-size: 28px; }
  @media (max-width: 480px) {
    .summary-highlight { flex-wrap: wrap; }
    .summary-highlight .summary-card { flex: 1 1 100%; }
  }

  /* SEÇÕES E TABELAS RESPONSIVAS */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 20px;
    overflow: hidden;
    transition: all 0.3s ease;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
    transition: all 0.3s ease;
  }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .3px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .table-wrapper {
    width: 100%;
    overflow-x: auto;
  }

  /* Tabela */
  table { width: 100%; border-collapse: collapse; min-width: 650px; table-layout: auto; }
  thead tr { background: var(--surface2); transition: all 0.3s ease; }
  th {
    padding: 10px 14px; text-align: left; font-size: 11px;
    text-transform: uppercase; letter-spacing: .7px; color: var(--muted);
    font-weight: 600; border-bottom: 1px solid var(--border);
  }
  th.right, td.right { text-align: right; }
  th.center, td.center { text-align: center; }
  td { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,.02); }

  .money { font-family: var(--mono); font-size: 13px; white-space: nowrap; }

  /* STATUS BADGE */
  .badge {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px;
    border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap;
    border: none; font-family: var(--sans);
  }
  .badge.ok { background: rgba(0,212,170,.12); color: var(--ok); }
  .badge.above { background: rgba(255,77,106,.12); color: var(--danger); }
  .badge.next { background: rgba(124,92,252,.12); color: var(--accent); }
  .badge.none { background: rgba(86,95,126,.1); color: var(--muted); }
  
  /* Categoria Badge */
  .badge.cat { 
    background: rgba(255,255,255,0.03); border: 1px solid var(--border); 
    font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
  }

  /* BOTÕES */
  .btn {
    padding: 7px 14px; border-radius: 8px; border: 1px solid transparent;
    cursor: pointer; font-family: var(--sans); font-size: 12px; font-weight: 600;
    transition: all .15s; display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: var(--btn-text, #fff); border-color: var(--accent); }	
  .btn-primary:hover { opacity: .85; }
  .btn-ghost { background: transparent; color: var(--text2); border-color: var(--border); }
  .btn-ghost:hover { color: var(--text); border-color: var(--text2); }
  .btn-danger { background: rgba(255,77,106,.1); color: var(--danger); border-color: transparent; }
  .btn-danger:hover { background: rgba(255,77,106,.2); }
  .btn-sm { padding: 4px 10px; font-size: 11px; border-radius: 6px; }

  /* MODAL */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7);
    z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 28px; width: 90%; max-width: 500px; position: relative;
    max-height: 90vh; overflow-y: auto;
    transition: all 0.3s ease;
  }
  .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }

  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .form-control {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 9px 12px;
    font-family: var(--sans); font-size: 13px; transition: border-color .15s;
  }
  .form-control:focus { outline: none; border-color: var(--accent); }
  input[type="color"].form-control { padding: 2px 4px; height: 38px; cursor: pointer; }
  select.form-control option { background: var(--surface); color: var(--text); }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-row.three { grid-template-columns: 1fr 1fr 1fr; }
  .form-row.two-uneven { grid-template-columns: 1fr 80px; }

  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }

  /* EMPTY STATE */
  .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
  .empty .icon { font-size: 36px; margin-bottom: 12px; }
  .empty p { font-size: 13px; }
  .total-row td { border-top: 2px solid var(--border); font-weight: 700; background: var(--surface2); }

  /* HISTORICO LOG */
  .log-entry { display: flex; align-items: flex-start; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--border); }
  .log-entry:last-child { border-bottom: none; }
  .log-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
  .log-icon.expense { background: rgba(255,77,106,.12); }
  .log-icon.income { background: rgba(0,212,170,.12); }
  .log-details { flex: 1; min-width: 0; }
  .log-name { font-weight: 600; font-size: 13px; }
  .log-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .log-amount { font-family: var(--mono); font-size: 14px; font-weight: 600; flex-shrink: 0; }
  .log-amount.expense { color: var(--danger); }
  .log-amount.income { color: var(--ok); }
  
  /* Ajuste de Botões na Tabela */
  .row-actions { opacity: 0; transition: opacity .15s; white-space: nowrap; text-align: right; }
  tr:hover .row-actions { opacity: 1; }

  /* LISTA DE CATEGORIAS */
  .cat-list { margin-top: 20px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); max-height: 200px; overflow-y: auto; }
  .cat-list-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .cat-list-item:last-child { border-bottom: none; }
  .cat-list-item:hover { background: var(--surface); }
  .cat-info { display: flex; align-items: center; gap: 10px; }
  .cat-color-dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); }

  /* ESCALA PARA PC */
  @media (min-width: 768px) {
    body { zoom: 1.1; }
    .summary-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
    .summary-card { padding: 16px 12px; }
    .summary-card .label { font-size: 10px; }
    .summary-card .value { font-size: 17px; }
  }
</style>
</head>
<body>
<!-- OVERLAY E SIDEBAR OCULTA -->
<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
<aside class="sidebar-drawer" id="sidebar-drawer">
  <div class="sidebar-header">
    <h4><i class="fa-solid fa-folder-open"></i> Gerenciar Meses</h4>
    <button class="btn btn-ghost" onclick="closeSidebar()"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="sidebar-section-title">Ativos</div>
  <div class="month-list" id="active-months-drawer"></div>
  
  <div class="sidebar-section-title">Arquivados</div>
  <div class="month-list archived" id="archived-months-drawer"></div>
</aside>

<datalist id="cat-list"></datalist>

<header>
  <div class="header-top">
    <!-- Adicionamos apenas o botão de abrir a sidebar aqui, junto com a logo -->
    <div class="logo">
      <button class="btn btn-ghost" onclick="openSidebar()" style="padding: 4px 8px; margin-right: 4px;" title="Gerenciar Meses">
        <i class="fa-solid fa-bars"></i>
      </button>
      <i class="fa-solid fa-money-bill-wave"></i> <span>Controle de Grana</span>
    </div>
    
    <!-- Seus botões originais mantidos intactos -->
    <div class="header-actions">
      <button class="btn btn-ghost" onclick="openSettingsModal()" title="Temas e Cores"><i class="fa-solid fa-palette"></i> Temas</button>
      <button class="btn btn-ghost" onclick="openCatModal()" title="Gerenciar Categorias"><i class="fa-solid fa-tags"></i> Categorias</button>
      <button class="btn btn-ghost" onclick="importData()" title="Importar backup JSON"><i class="fa-solid fa-file-import"></i> Importar</button>
      <button class="btn btn-ghost" onclick="exportData()" title="Exportar backup JSON"><i class="fa-solid fa-file-export"></i> Exportar</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="handleImport(event)">
      <button class="btn btn-primary" onclick="openModal('modal-month')"><i class="fa-solid fa-plus"></i> Novo mês</button>
    </div>
  </div>
  
  <div class="month-tabs" id="month-tabs"></div>
</header>

<main id="main-content"></main>

<div class="modal-overlay" id="modal-settings">
  <div class="modal">
    <h3><i class="fa-solid fa-palette"></i> Cores e Tema</h3>
    
    <div class="form-group">
      <label class="form-label">Tema Rápido</label>
      <select class="form-control" id="theme-select" onchange="changeTheme(this.value)">
        <option value="default">Roxo Espacial (Padrão)</option>
        <option value="rose">Rosa Choque (for Maria ❤)</option>
        <option value="blue">Azul Oceano 🌊</option>
        <option value="midnight">All Black 🦇</option>
        <option value="custom">Personalizado 🎨</option>
      </select>
    </div>

    <div id="custom-theme-options" style="display: none; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);">
      <label class="form-label" style="margin-bottom:12px; color: var(--accent);">Monte sua Paleta Livre</label>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Cabeçalho / Cards</label>
          <input class="form-control" type="color" id="color-header" onchange="updateCustomTheme()">
        </div>
        <div class="form-group">
          <label class="form-label">Fundo da Tela</label>
          <input class="form-control" type="color" id="color-bg" onchange="updateCustomTheme()">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Botões / Destaques</label>
        <input class="form-control" type="color" id="color-accent" onchange="updateCustomTheme()">
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-primary" onclick="closeSettingsModal()">Aplicar e Fechar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-categories">
  <div class="modal">
    <h3><i class="fa-solid fa-tags"></i> Gerenciar Categorias</h3>
    <div class="form-row two-uneven">
      <div class="form-group">
        <label class="form-label">Nome da Categoria</label>
        <input class="form-control" id="cat-name-input" type="text" placeholder="Ex: Viagem">
      </div>
      <div class="form-group">
        <label class="form-label">Cor</label>
        <input class="form-control" id="cat-color-input" type="color" value="#7c5cfc">
      </div>
    </div>
    <div style="text-align: right">
      <button class="btn btn-primary btn-sm" id="btn-save-cat" onclick="saveCategory()"><i class="fa-solid fa-plus"></i> Adicionar</button>
    </div>
    <div class="cat-list" id="cat-list-container"></div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeCatModal()">Fechar</button></div>
  </div>
</div>

<div class="modal-overlay" id="modal-month">
  <div class="modal">
    <h3><i class="fa-regular fa-calendar"></i> Novo Mês</h3>
    <div class="form-row">
      <div class="form-group" style="flex: 2;">
        <label class="form-label">Nome do mês</label>
        <input class="form-control" id="new-month-name" type="text" placeholder="ex: Agosto 2026">
      </div>
      <div class="form-group" style="flex: 1;">
        <label class="form-label">Dia que fecha</label>
        <input class="form-control" id="new-month-closing" type="number" min="1" max="31" value="29">
      </div>
    </div>
	<div class="form-group">
      <label style="display:flex; align-items:center; gap:8px; cursor:pointer; color: var(--text2); font-size: 13px;">
        <input type="checkbox" id="clone-last" checked> 
        <span>Importar <strong>Fixas</strong>, progredir <strong>Parcelas</strong> e itens para o <strong>Mês que vem</strong></span>
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-month')">Cancelar</button>
      <button class="btn btn-primary" onclick="createMonth()">Criar mês</button>
    </div>
  </div>
</div>

<!-- NOVO MODAL: AJUSTE RÁPIDO -->
<div class="modal-overlay" id="modal-quick-add">
  <div class="modal" style="max-width: 350px;">
    <h3><i class="fa-solid fa-bolt"></i> Ajuste Rápido</h3>
    <p id="quick-add-desc" style="margin-bottom: 16px; color: var(--text2); font-size: 13px;"></p>
    <div class="form-group">
      <label class="form-label">Valor do novo gasto (R$)</label>
      <input class="form-control money-input-mask" type="text" inputmode="numeric" id="quick-add-value" placeholder="0,00">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeQuickAdd()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveQuickAdd()"><i class="fa-solid fa-plus"></i> Somar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-expense">
  <div class="modal">
    <h3 id="modal-expense-title"><i class="fa-regular fa-credit-card"></i> Adicionar Gasto (Fatura)</h3>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Descrição</label>
        <input class="form-control" id="exp-name" type="text" placeholder="ex: Internet, Netflix...">
      </div>
      <div class="form-group">
        <label class="form-label">Categoria</label>
        <select class="form-control" id="exp-category"></select>
      </div>

<script>
/* ---- sincronia entre aparelhos ---- */
/* sync.js — sincronia entre aparelhos para apps HTML de uma página só.
 *
 * Como usar, dentro do seu app:
 *
 *   const sync = criaSync({
 *     app: 'financas',            // vira o caminho no servidor: /financas
 *     chave: 'financas:v1',       // onde guarda no navegador
 *     ler:     ()      => estado, // devolve o objeto que você quer salvar
 *     aplicar: (novo)  => { estado = novo; render(); },
 *     aviso:   (tipo,msg) => console.log(tipo, msg)   // opcional
 *   });
 *
 *   estado = sync.carregar() || estadoInicial();   // ao abrir
 *   await sync.iniciar();                          // lê link e puxa do servidor
 *   ...
 *   sync.salvar();   // chame depois de QUALQUER alteração
 *
 * Para ligar: sync.configurar('https://SEU-WORKER.workers.dev', 'seu-codigo')
 * A configuração é compartilhada por todos os apps do mesmo domínio —
 * configurou num, valeu pra todos.
 */

function criaSync(cfg) {
  const CONF = 'sync:conf';          // endereço + código, comum a todos os apps
  const avisa = (t, m) => { try { cfg.aviso && cfg.aviso(t, m); } catch (e) {} };

  const lerLocal = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const gravarLocal = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };

  const conf = () => { try { return JSON.parse(lerLocal(CONF) || '{}'); } catch (e) { return {}; } };
  const ativo = () => { const c = conf(); return !!(c.url && c.codigo); };
  const endereco = () => conf().url.replace(/\/+$/, '') + '/' + cfg.app;

  let empurrando = null, sincronizando = false;

  /* --- envelope: seus dados + o carimbo de hora --- */
  const embrulha = dados => JSON.stringify({ _v: 1, _atualizado: Date.now(), dados });
  function desembrulha(txt) {
    try {
      const o = JSON.parse(txt);
      if (o && o._v === 1 && 'dados' in o) return o;
      return null;
    } catch (e) { return null; }
  }
  const quando = () => { const o = desembrulha(lerLocal(cfg.chave) || ''); return o ? o._atualizado : 0; };

  /* --- link do tipo  #sync=<base64>  --- */
  function empacota(url, codigo) {
    return btoa(unescape(encodeURIComponent(url + '|' + codigo))).replace(/=+$/, '');
  }
  function leLink() {
    const m = (location.hash || '').match(/^#sync=(.+)$/);
    if (!m) return null;
    try {
      const txt = decodeURIComponent(escape(atob(decodeURIComponent(m[1]))));
      const i = txt.indexOf('|');
      const url = txt.slice(0, i), codigo = txt.slice(i + 1);
      if (url && codigo) return { url, codigo };
    } catch (e) {}
    return null;
  }

  const api = {
    ativo,
    config: conf,

    configurar(url, codigo) {
      if (url && codigo) gravarLocal(CONF, JSON.stringify({ url: url.replace(/\/+$/, ''), codigo }));
      else gravarLocal(CONF, '{}');
      return ativo();
    },

    /* link que já entra configurado em outro aparelho ou pra outra pessoa */
    link(codigo) {
      const c = conf();
      if (!c.url) return '';
      return location.origin + location.pathname + '#sync=' + empacota(c.url, codigo || c.codigo);
    },

    /* Lê o que está guardado neste aparelho.
       Se encontrar dado no formato antigo (sem carimbo de hora), adota e
       carimba na hora — senão ele nunca ganharia do servidor vazio. */
    carregar() {
      const raw = lerLocal(cfg.chave);
      if (!raw) return null;
      const o = desembrulha(raw);
      if (o) return o.dados;
      try {
        const legado = JSON.parse(raw);
        if (legado && typeof legado === 'object') {
          gravarLocal(cfg.chave, embrulha(legado));
          return legado;
        }
      } catch (e) {}
      return null;
    },

    salvar() {
      const ok = gravarLocal(cfg.chave, embrulha(cfg.ler()));
      if (!ok) avisa('erro', 'este navegador não guardou os dados');
      if (ativo()) { clearTimeout(empurrando); empurrando = setTimeout(api.empurrar, 1800); }
      return ok;
    },

    async empurrar() {
      if (!ativo()) return false;
      avisa('indo', 'enviando');
      try {
        const r = await fetch(endereco(), {
          method: 'PUT',
          headers: { 'content-type': 'application/json', 'x-codigo': conf().codigo },
          body: lerLocal(cfg.chave)
        });
        if (r.status === 401) { avisa('erro', 'código recusado'); return false; }
        if (!r.ok) throw 0;
        avisa('ok', 'sincronizado');
        return true;
      } catch (e) { avisa('erro', 'sem conexão'); return false; }
    },

    async sincroniza() {
      if (!ativo() || sincronizando) return;
      sincronizando = true;
      avisa('indo', 'sincronizando');
      try {
        const r = await fetch(endereco(), { headers: { 'x-codigo': conf().codigo }, cache: 'no-store' });
        if (r.status === 401) { avisa('erro', 'código recusado'); return; }
        if (!r.ok) throw 0;
        const remoto = desembrulha(await r.text());
        const meu = quando();
        if (remoto && remoto._atualizado > meu) {
          gravarLocal(cfg.chave, JSON.stringify(remoto));
          cfg.aplicar(remoto.dados);
          avisa('ok', 'trouxe do servidor');
        } else if (meu > (remoto ? remoto._atualizado : 0)) {
          await api.empurrar();
        } else {
          avisa('ok', 'tudo em dia');
        }
      } catch (e) { avisa('erro', 'servidor fora do ar'); }
      finally { sincronizando = false; }
    },

    /* chame uma vez, ao abrir */
    async iniciar() {
      const convite = leLink();
      if (convite) {
        api.configurar(convite.url, convite.codigo);
        try { history.replaceState(null, '', location.pathname + location.search); }
        catch (e) { location.hash = ''; }
        avisa('ok', 'sincronia configurada');
      }
      addEventListener('online', () => api.sincroniza());
      document.addEventListener('visibilitychange', () => { if (!document.hidden) api.sincroniza(); });
      addEventListener('pagehide', () => { if (ativo()) api.empurrar(); });
      await api.sincroniza();
    }
  };

  return api;
}

</script>
<script>
// ===== STATE =====
const MONTH_NAMES_PT = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var _sinal=null,_t=null;
function sinal(tipo,msg){
  if(!_sinal){
    _sinal=document.createElement('div');
    _sinal.style.cssText='position:fixed;left:12px;bottom:14px;z-index:9999;font:12px -apple-system,sans-serif;'+
      'padding:7px 12px;border-radius:99px;opacity:0;transition:opacity .2s;background:rgba(0,0,0,.75);'+
      'color:#fff;pointer-events:none';
    document.body.appendChild(_sinal);
  }
  _sinal.textContent=msg;
  _sinal.style.color=(tipo==='erro')?'#ff8f94':'#fff';
  _sinal.style.opacity='1';
  clearTimeout(_t);
  if(tipo!=='indo') _t=setTimeout(function(){ _sinal.style.opacity='0' }, tipo==='erro'?4000:1200);
}

const sync = criaSync({
  app:'grana', chave:'controle_grana',
  ler: () => data,
  aplicar: (novo) => { data = novo; try{ renderAll(); }catch(e){} },
  aviso: sinal
});

let data = sync.carregar() || {months:[]};
let currentMonth = null;
let editingExpenseId = null;
let editingPixId = null;
let editingIncomeId = null;
let editingCatId = null;
let sortCol = 'category';
let sortDir = 1;
let myChart = null;

// Garante que tema e as cores personalizadas existam na memória
if (!data.theme) data.theme = 'default';
if (!data.customTheme) data.customTheme = { header: '#1e2130', bg: '#0f1117', accent: '#7c5cfc' };

// Definição das Paletas de Cores Prontas
const themePalettes = {
  default:  { bg: '#0f1117', surface: '#181b23', surface2: '#1e2130', accent: '#7c5cfc', accent2: '#00d4aa', border: '#2a2f42' },
  rose:     { bg: '#1a0f14', surface: '#24151c', surface2: '#2e1a24', accent: '#ff4d85', accent2: '#ff8fa3', border: '#3d2532' },
  blue:     { bg: '#0b1120', surface: '#111a2e', surface2: '#1a253c', accent: '#3b82f6', accent2: '#60a5fa', border: '#1e2d4a' },
  midnight: { bg: '#000000', surface: '#0a0a0a', surface2: '#141414', accent: '#ffffff', accent2: '#cccccc', border: '#222222' }
};

function applyTheme(themeName) {
  const root = document.documentElement;
  let t;

  if (themeName === 'custom') {
    // Se for personalizado, puxa os valores salvos no customTheme
    t = {
      bg: data.customTheme.bg,
      surface: data.customTheme.header,
      surface2: data.customTheme.header,
      accent: data.customTheme.accent,
      accent2: data.customTheme.accent,
      border: 'rgba(255,255,255,0.1)' // Borda sutil automática
    };
  } else {
    // Puxa da paleta pronta
    t = themePalettes[themeName] || themePalettes.default;
  }

  root.style.setProperty('--bg', t.bg);
  root.style.setProperty('--surface', t.surface);
  root.style.setProperty('--surface2', t.surface2);
  root.style.setProperty('--accent', t.accent);
  root.style.setProperty('--accent2', t.accent2);
  root.style.setProperty('--border', t.border);
  root.style.setProperty('--btn-text', themeName === 'midnight' ? '#000000' : '#ffffff');
  
  const metaTheme = document.getElementById('meta-theme-color');
  if(metaTheme) metaTheme.setAttribute("content", t.surface2);
}

// Inicializa a cor ao abrir
applyTheme(data.theme);

if (!data.categories) {
  data.categories = [
    { id: 'c1', name: 'Contas Fixas', color: '#ff4d6a' },
    { id: 'c2', name: 'Supermercado', color: '#00d4aa' },
    { id: 'c3', name: 'Lazer / Saídas', color: '#7c5cfc' },
    { id: 'c4', name: 'Transporte', color: '#ffb547' },
    { id: 'c5', name: 'Saúde', color: '#5ca1fc' },
    { id: 'c6', name: 'Vestuário', color: '#e2e5f0' },
    { id: 'c7', name: 'Outros', color: '#565f7e' }
  ];
  save();
}

function save() { sync.salvar(); }

// ===== TEMAS LOGIC =====
function openSettingsModal() {
  document.getElementById('theme-select').value = data.theme;
  document.getElementById('color-header').value = data.customTheme.header;
  document.getElementById('color-bg').value = data.customTheme.bg;
  document.getElementById('color-accent').value = data.customTheme.accent;
  
  toggleCustomOptions(data.theme);
  openModal('modal-settings');
}

function closeSettingsModal() { closeModal('modal-settings'); }

function toggleCustomOptions(themeName) {
  const customDiv = document.getElementById('custom-theme-options');
  if (themeName === 'custom') {
    customDiv.style.display = 'block';
  } else {
    customDiv.style.display = 'none';
  }
}

function changeTheme(newTheme) {
  data.theme = newTheme;
  toggleCustomOptions(newTheme);
  applyTheme(newTheme);
  save();
}

function updateCustomTheme() {
  data.customTheme = {
    header: document.getElementById('color-header').value,
    bg: document.getElementById('color-bg').value,
    accent: document.getElementById('color-accent').value
  };
  data.theme = 'custom';
  document.getElementById('theme-select').value = 'custom';
  applyTheme('custom');
  save();
}

// ===== UTILS =====
function fmt(v) {
  if (v === null || v === undefined || v === '') return '—';
  return 'R$ ' + Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function getMoneyValue(id) {
  let val = document.getElementById(id).value;
  if (!val) return 0;
  return Number(val.replace(/\./g, '').replace(',', '.')) || 0;
}

function setMoneyValue(id, value) {
  if (!value && value !== 0) { document.getElementById(id).value = ''; return; }
  document.getElementById(id).value = Number(value).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

// Retorna um pequeno ícone indicando que o item já foi editado (data completa só no hover)
function lastEditBadge(item) {
  if (!item.updatedAt || !item.ts || item.updatedAt <= item.ts) return '';
  const d = new Date(item.updatedAt).toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
  return `<i class="fa-solid fa-pen" style="font-size:9px;color:var(--muted);margin-left:6px;cursor:default" title="Editado em ${d}"></i>`;
}

function getCategory(idOrName) {
  if (!idOrName) return { id: 'outros', name: 'Outros', color: '#565f7e' };
  let cat = data.categories.find(c => c.id === idOrName || c.name === idOrName);
  if (!cat) return { id: 'outros', name: 'Outros', color: '#565f7e' };
  return cat;
}

const getSortIcon = (col) => sortCol === col ? (sortDir === 1 ? '<i class="fa-solid fa-caret-up"></i>' : '<i class="fa-solid fa-caret-down"></i>') : '<i class="fa-solid fa-sort" style="opacity:0.3"></i>';

// ===== STATUS LOGIC =====
function getStatusHtml(exp) {
  const e = Number(exp.estimated || 0), f = Number(exp.future || 0), a = Number(exp.actual || 0);
  const currentVal = Math.max(a, f);
  
  if (e === 0 && currentVal === 0) return `<span class="badge none">—</span>`;
  if (currentVal > e) return `<span class="badge above"><i class="fa-solid fa-triangle-exclamation"></i> Acima do limite</span>`;
  if (e > currentVal) {
    if (exp.statusChoice === 'next') return `<span class="badge next" style="cursor:pointer" onclick="resetStatus('${exp.id}')" title="Clique para alterar">Fica pro mês que vem</span>`;
    if (exp.statusChoice === 'less') return `<span class="badge ok" style="cursor:pointer" onclick="resetStatus('${exp.id}')" title="Clique para alterar">Gasto menor que o esperado</span>`;
    return `<select class="badge none" style="cursor:pointer; border: 1px dashed var(--muted); max-width: 150px;" onchange="updateExpenseStatus('${exp.id}', this.value)">
              <option value="" disabled selected>Definir status ▼</option>
              <option value="next">Fica pro mês que vem</option>
              <option value="less">Gasto menor que o esperado</option>
            </select>`;
  }
  return `<span class="badge ok"><i class="fa-solid fa-check"></i> OK</span>`;
}

function updateExpenseStatus(id, value) {
  const month = data.months.find(m => m.id === currentMonth);
  const exp = month.expenses.find(e => e.id === id);
  if (exp) { exp.statusChoice = value; save(); renderAll(); }
}

function resetStatus(id) {
  const month = data.months.find(m => m.id === currentMonth);
  const exp = month.expenses.find(e => e.id === id);
  if (exp) { exp.statusChoice = null; save(); renderAll(); }
}

function setSort(col) {
  if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
  renderAll();
}

function getStatusWeight(exp) {
  const e = Number(exp.estimated || 0), f = Number(exp.future || 0), a = Number(exp.actual || 0);
  const val = Math.max(a, f);
  if (e === 0 && val === 0) return 0;
  if (val > e) return 3; 
  if (e > val && !exp.statusChoice) return 2; 
  return 1; 
}

// ===== CATEGORIAS =====
function populateCategorySelects() {
  const options = data.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  const emptyOption = `<option value="">Selecione...</option>`;
  document.getElementById('exp-category').innerHTML = emptyOption + options;
  document.getElementById('pix-category').innerHTML = emptyOption + options;
}

function openCatModal() {
  editingCatId = null;
  document.getElementById('cat-name-input').value = '';
  document.getElementById('cat-color-input').value = '#7c5cfc';
  document.getElementById('btn-save-cat').innerHTML = '<i class="fa-solid fa-plus"></i> Adicionar';
  renderCatList();
  openModal('modal-categories');
}

function closeCatModal() {
  closeModal('modal-categories');
  populateCategorySelects();
  renderAll(); 
}

function renderCatList() {
  const container = document.getElementById('cat-list-container');
  if (data.categories.length === 0) {
    container.innerHTML = `<div style="padding: 14px; text-align:center; color: var(--muted); font-size: 12px;">Nenhuma categoria criada.</div>`;
    return;
  }
  container.innerHTML = data.categories.map(c => `
    <div class="cat-list-item">
      <div class="cat-info"><div class="cat-color-dot" style="background: ${c.color}"></div><span>${c.name}</span></div>
      <div class="row-actions" style="opacity:1">
        <button class="btn btn-ghost btn-sm" onclick="editCategory('${c.id}')"><i class="fa-solid fa-pen"></i></button>
        <button class="btn btn-danger btn-sm" onclick="deleteCategory('${c.id}')"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>
  `).join('');
}

function saveCategory() {
  const name = document.getElementById('cat-name-input').value.trim();
  const color = document.getElementById('cat-color-input').value;
  if (!name) return alert('Dê um nome para a categoria!');

  if (editingCatId) {
    const idx = data.categories.findIndex(c => c.id === editingCatId);
    if (idx > -1) data.categories[idx] = { id: editingCatId, name, color };
    editingCatId = null;
    document.getElementById('btn-save-cat').innerHTML = '<i class="fa-solid fa-plus"></i> Adicionar';
  } else {
    data.categories.push({ id: genId(), name, color });
  }

  document.getElementById('cat-name-input').value = '';
  save(); renderCatList();
}

function editCategory(id) {
  const cat = data.categories.find(c => c.id === id);
  if (!cat) return;
  editingCatId = id;
  document.getElementById('cat-name-input').value = cat.name;
  document.getElementById('cat-color-input').value = cat.color;
  document.getElementById('btn-save-cat').innerHTML = '<i class="fa-solid fa-check"></i> Atualizar';
}

function deleteCategory(id) {
  if(!confirm('Deletar essa categoria? Itens antigos serão marcados como Outros.')) return;
  data.categories = data.categories.filter(c => c.id !== id);
  save(); renderCatList();
}

// ===== CHART.JS =====
function renderChart(month) {
  const ctx = document.getElementById('categoryChart');
  if (!ctx) return;

  const catTotals = {};
  
  month.expenses.forEach(e => {
      const val = Number(e.future || 0); 
      if(val > 0) { 
          const cat = getCategory(e.categoryId || e.category);
          if (!catTotals[cat.name]) catTotals[cat.name] = { val: 0, color: cat.color };
          catTotals[cat.name].val += val; 
      }
  });
  
  month.pix.forEach(p => {
      const val = Number(p.value||0);
      if(val > 0) { 
          const cat = getCategory(p.categoryId || p.category);
          if (!catTotals[cat.name]) catTotals[cat.name] = { val: 0, color: cat.color };
          catTotals[cat.name].val += val; 
      }
  });
  
  const labels = [], dataVals = [], colors = [];
  Object.keys(catTotals).forEach(catName => {
      labels.push(catName); 
      dataVals.push(catTotals[catName].val); 
      colors.push(catTotals[catName].color);
  });
  
  if (myChart) myChart.destroy();
  const chartContainer = document.getElementById('chart-container');
  if (dataVals.length === 0) {
      if (chartContainer) chartContainer.style.display = 'none';
      document.getElementById('chart-empty').style.display = 'block';
      return;
  } else {
      if (chartContainer) chartContainer.style.display = 'block';
      document.getElementById('chart-empty').style.display = 'none';
  }

  myChart = new Chart(ctx, {
      type: 'doughnut',
      data: { labels: labels, datasets: [{ data: dataVals, backgroundColor: colors, borderWidth: 0, hoverOffset: 4 }] },
      options: {
          responsive: true, maintainAspectRatio: false, cutout: '70%',
          plugins: {
              legend: { position: 'right', labels: { color: '#e2e5f0', font: {family: 'Inter', size: 12}, padding: 15 } },
              tooltip: { callbacks: { label: function(c) { return ' R$ ' + c.raw.toLocaleString('pt-BR', {minimumFractionDigits:2}); } } }
          }
      }
  });
}

function renderTabs() {

// === DRAG AND DROP HORIZONTAL (ABAS) ===
function initDragAndDropTabs() {
  const container = document.getElementById('month-tabs');
  if(!container) return;
  const items = container.querySelectorAll('.month-tab');
  let dragEl = null;

  items.forEach(item => {
    item.addEventListener('dragstart', function(e) {
      dragEl = this;
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => this.classList.add('dragging'), 0);
    });

    item.addEventListener('dragover', function(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      // Usa o eixo X (clientX) para drag horizontal
      const afterElement = getDragAfterElementTabs(container, e.clientX);
      if (afterElement == null) {
        container.appendChild(dragEl);
      } else {
        container.insertBefore(dragEl, afterElement);
      }
    });

    item.addEventListener('dragend', function() {
      this.classList.remove('dragging');
      updateMonthsOrderTabs();
    });
  });
}

function getDragAfterElementTabs(container, x) {
  const draggableElements = [...container.querySelectorAll('.month-tab:not(.dragging)')];
  return draggableElements.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = x - box.left - box.width / 2; // Eixo horizontal
    if (offset < 0 && offset > closest.offset) {
      return { offset: offset, element: child };
    } else {
      return closest;
    }
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}

function updateMonthsOrderTabs() {
  const container = document.getElementById('month-tabs');
  const activeIds = [...container.querySelectorAll('.month-tab')].map(el => el.dataset.id);
  
  const archived = data.months.filter(m => m.archived);
  const activesOld = data.months.filter(m => !m.archived);
  
  const newActives = [];
  activeIds.forEach(id => {
    const found = activesOld.find(m => m.id === id);
    if(found) newActives.push(found);
  });
  
  data.months = [...newActives, ...archived];
  save();
  renderSidebarDrawer(); // Atualiza a gaveta silenciosamente
}

function renderSidebarDrawer() {
  const activeContainer = document.getElementById('active-months-drawer');
  const archivedContainer = document.getElementById('archived-months-drawer');
  
  if(activeContainer) activeContainer.innerHTML = '';
  if(archivedContainer) archivedContainer.innerHTML = '';

  data.months.forEach((m) => {
    const div = document.createElement('div');
    // Removemos o cursor grab do CSS dinâmico e o draggable, deixando só estático na sidebar
    div.className = 'month-item' + (m.id === currentMonth ? ' active' : '') + (m.archived ? ' archived' : '');
    div.dataset.id = m.id;
    div.style.cursor = 'default';

    div.innerHTML = `
      <span style="flex:1; user-select:none; cursor:pointer" onclick="selectMonthDrawer('${m.id}')">${m.name}</span>
      <button class="btn-archive" onclick="toggleArchive('${m.id}')" title="${m.archived ? 'Desarquivar' : 'Arquivar'}">
        <i class="fa-solid ${m.archived ? 'fa-box-open' : 'fa-box-archive'}"></i>
      </button>
    `;

    if (m.archived) {
      if(archivedContainer) archivedContainer.appendChild(div);
    } else {
      if(activeContainer) activeContainer.appendChild(div);
    }
  });
}

function selectMonthDrawer(id) {
  currentMonth = id;
  closeSidebar();
  renderAll();
}

function toggleArchive(id) {
  const m = data.months.find(x => x.id === id);
  if (m) m.archived = !m.archived;
  
  if (m.archived && currentMonth === id) {
    const ativos = data.months.filter(x => !x.archived);
    if (ativos.length > 0) currentMonth = ativos[ativos.length - 1].id;
  }
  
  save();
  renderAll();
}

// ===== SOMA RÁPIDA =====
let quickAddState = { type: null, id: null };

function openQuickAdd(type, id, name) {
  quickAddState = { type, id };
  document.getElementById('quick-add-desc').innerHTML = `Somar novo valor em <strong>${name}</strong>:`;
  document.getElementById('quick-add-value').value = '';
  openModal('modal-quick-add');
  setTimeout(() => document.getElementById('quick-add-value').focus(), 100); 
}

function closeQuickAdd() {
  quickAddState = { type: null, id: null };
  closeModal('modal-quick-add');
}

function saveQuickAdd() {
  const valText = document.getElementById('quick-add-value').value;
  if (!valText) return closeQuickAdd();
  
  const val = Number(valText.replace(/\./g, '').replace(',', '.')) || 0;
  if (val === 0) return closeQuickAdd();

  const month = data.months.find(m => m.id === currentMonth);
  const now = Date.now();

  if (quickAddState.type === 'expense') {
    const exp = month.expenses.find(e => e.id === quickAddState.id);
    if (exp) {
      exp.actual = (Number(exp.actual) || 0) + val;
      exp.future = (Number(exp.future) || 0) + val; 
      if (!exp.edits) exp.edits = [];
      exp.edits.push({ diff: val, ts: now });
      exp.updatedAt = now;
    }
  } else if (quickAddState.type === 'pix') {
    const p = month.pix.find(e => e.id === quickAddState.id);
    if (p) {
      p.value = (Number(p.value) || 0) + val;
      if (!p.edits) p.edits = [];
      p.edits.push({ diff: val, ts: now });
      p.updatedAt = now;
    }
  }

  save();
  closeQuickAdd();
  renderAll();
}

// ===== EDITAR DIA FECHAMENTO =====
function editClosingDay(monthId) {
  const m = data.months.find(x => x.id === monthId);
  if(!m) return;
  const newDay = prompt(`Qual o dia de fechamento da fatura de ${m.name}?`, m.closingDay || 29);
  
  if(newDay !== null && !isNaN(newDay) && newDay > 0 && newDay <= 31) {
    m.closingDay = parseInt(newDay);
    save();
    renderAll();
  }
}

function renderLog(month) {
  const all = [];

  // Mapeia Cartões (Faturas)
  month.expenses.forEach(e => {
    const currentVal = Number(e.actual) || Number(e.future) || Number(e.estimated) || 0;
    const edits = e.edits || [];
    const totalDiff = edits.reduce((sum, ed) => sum + ed.diff, 0);
    const initialVal = currentVal - totalDiff; 

    // Adicionado 'id'
    all.push({type:'expense', name:e.name, amount: initialVal, method:'Fatura', obs:e.obs, ts:e.ts, id: e.id});

    edits.forEach(ed => {
      // Adicionado 'id', 'isEdit' e 'editTs'
      all.push({type:'expense', name:e.name + ' (ajuste)', amount: ed.diff, method:'Fatura', obs:'Valor alterado', ts:ed.ts, id: e.id, isEdit: true, editTs: ed.ts});
    });
  });

  // Mapeia Pix/Débito
  (month.pix || []).forEach(p => {
    const currentVal = Number(p.value) || 0;
    const edits = p.edits || [];
    const totalDiff = edits.reduce((sum, ed) => sum + ed.diff, 0);
    const initialVal = currentVal - totalDiff;

    all.push({type:'expense', name:p.name, amount: initialVal, method:'Pix/Débito', obs:p.obs, ts:p.ts, id: p.id});

    edits.forEach(ed => {
      all.push({type:'expense', name:p.name + ' (ajuste)', amount: ed.diff, method:'Pix/Débito', obs:'Valor alterado', ts:ed.ts, id: p.id, isEdit: true, editTs: ed.ts});
    });
  });

  // Mapeia Entradas
  month.income.forEach(i => {
    const currentVal = Number(i.value) || 0;
    const edits = i.edits || [];
    const totalDiff = edits.reduce((sum, ed) => sum + ed.diff, 0);
    const initialVal = currentVal - totalDiff;

    all.push({type:'income', name:i.name, amount: initialVal, method:'Entrada', obs:i.obs, ts:i.ts, id: i.id});

    edits.forEach(ed => {
      all.push({type:'income', name:i.name + ' (ajuste)', amount: ed.diff, method:'Entrada', obs:'Valor alterado', ts:ed.ts, id: i.id, isEdit: true, editTs: ed.ts});
    });
  });

  // Ordena do mais recente pro mais antigo
  all.sort((a,b) => b.ts - a.ts);

  if (!all.length) return `<div class="empty"><div class="icon"><i class="fa-solid fa-list-check"></i></div><p>Nenhum registro ainda.</p></div>`;

  return all.map(item => {
    let sign = '';
    let absAmount = Math.abs(item.amount);
    
    if (item.type === 'expense') {
      sign = item.amount >= 0 ? '−' : '+';
    } else {
      sign = item.amount >= 0 ? '+' : '−';
    }

    let colorClass = item.type; 
    if (item.type === 'expense' && item.amount < 0) colorClass = 'income'; 
    if (item.type === 'income' && item.amount < 0) colorClass = 'expense'; 

    const editTsParam = item.isEdit ? item.editTs : 'null';

    return `
      <div class="log-entry">
        <div class="log-icon ${colorClass}">${item.type === 'expense' ? '<i class="fa-solid fa-money-bill-wave"></i>' : '<i class="fa-solid fa-sack-dollar"></i>'}</div>
        <div class="log-details">
          <div class="log-name">${item.name}</div>
          <div class="log-meta">
            ${new Date(item.ts).toLocaleDateString('pt-BR', {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
            ${item.method ? ' · ' + item.method : ''}
            ${item.obs ? ' · ' + item.obs : ''}
          </div>
        </div>
        <div class="log-amount ${colorClass}">${sign}${fmt(absAmount)}</div>
        
        <!-- Botão de apagar recém adicionado -->
        <button class="btn btn-ghost btn-sm" style="margin-left:12px; color:var(--danger); opacity:0.3; transition: opacity 0.2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.3" onclick="deleteLogItem('${item.method}', '${item.id}', ${editTsParam})" title="Apagar do histórico"><i class="fa-solid fa-trash"></i></button>
      </div>
    `;
  }).join('');
}

function deleteLogItem(method, id, editTs) {
  const isAjuste = editTs !== null;
  const mensagem = isAjuste 
    ? 'Apagar esse ajuste do histórico? (Isso limpará este registro, mas não mudará o valor final da despesa atual)' 
    : 'Apagar este item completamente de todos os registros do mês?';
    
  if (!confirm(mensagem)) return;
  
  const month = data.months.find(m => m.id === currentMonth);
  
  if (method === 'Fatura') {
      const item = month.expenses.find(x => x.id === id);
      if (isAjuste) item.edits = item.edits.filter(ed => ed.ts !== editTs);
      else month.expenses = month.expenses.filter(e => e.id !== id);
      
  } else if (method === 'Pix/Débito') {
      const item = month.pix.find(x => x.id === id);
      if (isAjuste) item.edits = item.edits.filter(ed => ed.ts !== editTs);
      else month.pix = month.pix.filter(p => p.id !== id);
      
  } else if (method === 'Entrada') {
      const item = month.income.find(x => x.id === id);
      if (isAjuste) item.edits = item.edits.filter(ed => ed.ts !== editTs);
      else month.income = month.income.filter(i => i.id !== id);
  }
  
  save();
  renderAll();
}

// ===== CRIAR MÊS (COM CLONE DE FIXAS, PARCELAS E ADIADOS) =====
function createMonth() {
  const name = document.getElementById('new-month-name').value.trim();
  const closingDay = parseInt(document.getElementById('new-month-closing').value) || 29;
  if (!name) { alert('Coloca o nome do mês!'); return; }
  
  const newMonth = { id: genId(), name, closingDay, expenses: [], pix: [], income: [] };
  const clone = document.getElementById('clone-last').checked;

  if (clone && data.months.length > 0) {
    const lastMonth = data.months[data.months.length - 1];
    
    lastMonth.expenses.forEach(e => {
      const cat = getCategory(e.categoryId || e.category);
      let isFixa = cat.name.toLowerCase().includes('fixa');
      
      // Nova verificação para a marcação de ir para o mês que vem
      let isFicaProMesQueVem = e.statusChoice === 'next';
      
      let match = e.name.match(/\((\d+)\/(\d+)\)/);
      let isParcela = false;
      let newName = e.name;
      
      if (match) {
        let cur = parseInt(match[1]);
        let tot = parseInt(match[2]);
        if (cur < tot) {
            isParcela = true;
            newName = e.name.replace(/\(\d+\/\d+\)/, `(${cur + 1}/${tot})`);
        } else {
            return; // Terminou de pagar a parcela
        }
      }
      
      // Se for fixa, parcela em andamento ou estava marcado para o mês que vem
      if (isFixa || isParcela || isFicaProMesQueVem) {
        const cloneTs = Date.now();
        newMonth.expenses.push({
            ...e, id: genId(), name: newName, actual: 0, statusChoice: null, ts: cloneTs, updatedAt: cloneTs
        });
      }
    });

    // Clona PIX/Débito marcados como fixos
    (lastMonth.pix || []).forEach(p => {
      if (p.isFixed) {
        const cloneTs = Date.now();
        newMonth.pix.push({
            ...p, id: genId(), edits: [], obs: p.obs, ts: cloneTs, updatedAt: cloneTs
        });
      }
    });
  }

  data.months.push(newMonth);
  currentMonth = newMonth.id;
  save(); closeModal('modal-month'); document.getElementById('new-month-name').value = ''; renderAll();
}

// ===== GASTOS FATURAS =====
function openExpenseModal() {
  editingExpenseId = null;
  document.getElementById('modal-expense-title').innerHTML = '<i class="fa-regular fa-credit-card"></i> Adicionar Gasto (Fatura)';
  ['exp-name','exp-category','exp-estimated','exp-future','exp-actual','exp-obs'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('exp-is-installment').checked = false;
  document.getElementById('exp-installment-current').value = 1;
  document.getElementById('exp-installments').value = 2;
  document.getElementById('div-installments').style.display = 'none';
  document.getElementById('exp-is-installment').parentElement.style.display = 'flex'; // mostra checkbox
  openModal('modal-expense');
}
function closeExpenseModal() { editingExpenseId = null; closeModal('modal-expense'); }

function editExpense(id) {
  const month = data.months.find(m => m.id === currentMonth);
  const exp = month.expenses.find(e => e.id === id);
  if(!exp) return;
  editingExpenseId = id;
  document.getElementById('modal-expense-title').innerHTML = '<i class="fa-solid fa-pen"></i> Editar Fatura';

  // Detecta se o nome já tem padrão de parcela (ex: "Nome (2/5)")
  const match = exp.name.match(/^(.*)\s\((\d+)\/(\d+)\)$/);

  document.getElementById('exp-name').value = match ? match[1] : exp.name;
  document.getElementById('exp-category').value = exp.categoryId || exp.category || '';
  setMoneyValue('exp-estimated', exp.estimated);
  setMoneyValue('exp-future', exp.future);
  setMoneyValue('exp-actual', exp.actual);
  document.getElementById('exp-obs').value = exp.obs || '';

  // Mostra a opção de parcela também na edição
  document.getElementById('exp-is-installment').parentElement.style.display = 'flex';

  if (match) {
    document.getElementById('exp-is-installment').checked = true;
    document.getElementById('exp-installment-current').value = match[2];
    document.getElementById('exp-installments').value = match[3];
    document.getElementById('div-installments').style.display = 'flex';
  } else {
    document.getElementById('exp-is-installment').checked = false;
    document.getElementById('exp-installment-current').value = 1;
    document.getElementById('exp-installments').value = 2;
    document.getElementById('div-installments').style.display = 'none';
  }

  openModal('modal-expense');
}

function saveExpense() {
  let name = document.getElementById('exp-name').value.trim();
  const categoryId = document.getElementById('exp-category').value;
  const estimated = getMoneyValue('exp-estimated');
  const future = getMoneyValue('exp-future');
  const actual = getMoneyValue('exp-actual');
  const obs = document.getElementById('exp-obs').value.trim();
  if (!name) return alert('Coloca a descrição!');

  // Logica de parcela (na criação e também na edição)
  if (document.getElementById('exp-is-installment').checked) {
     const atual = document.getElementById('exp-installment-current').value || 1;
     const vezes = document.getElementById('exp-installments').value;
     name = `${name} (${atual}/${vezes})`;
  }

  const month = data.months.find(m => m.id === currentMonth);

  if (editingExpenseId) {
    const idx = month.expenses.findIndex(e => e.id === editingExpenseId);
    if(idx > -1) {
      const oldObj = month.expenses[idx];
      // Pega o valor atual que estava salvo
      const oldVal = Number(oldObj.actual) || Number(oldObj.future) || Number(oldObj.estimated) || 0;
      // Pega o novo valor
      const newVal = Number(actual) || Number(future) || Number(estimated) || 0;
      const diff = newVal - oldVal;

      const edits = oldObj.edits || [];
      // Se houve diferença de valor, cria um log
      if (diff !== 0) edits.push({ diff, ts: Date.now() });

      month.expenses[idx] = { ...oldObj, name, categoryId, estimated, future, actual, obs, edits, updatedAt: Date.now() };
    }
  } else {
    const now = Date.now();
    month.expenses.push({ id: genId(), name, categoryId, estimated, future, actual, obs, ts: now, updatedAt: now });
  }
  save(); closeExpenseModal(); renderAll();
}

function deleteExpense(id) {
  if (!confirm('Deletar esse gasto?')) return;
  
  const month = data.months.find(m => m.id === currentMonth);
  month.expenses = month.expenses.filter(e => e.id !== id);
  
  save(); 
  renderAll();
}

function closePixModal() { editingPixId = null; closeModal('modal-pix'); }

  editingPixId = id;

  const month = data.months.find(m => m.id === currentMonth);

  if (editingPixId) {
    const idx = month.pix.findIndex(p => p.id === editingPixId);
    if(idx > -1) {
      const oldObj = month.pix[idx];
      const oldVal = Number(oldObj.value) || 0;
      const newVal = Number(value) || 0;
      const diff = newVal - oldVal;

      const edits = oldObj.edits || [];
      if (diff !== 0) edits.push({ diff, ts: Date.now() });

      month.pix[idx] = { ...oldObj, name, categoryId, value, obs, isFixed, edits, updatedAt: Date.now() };
    }
  } else {
    const now = Date.now();
    month.pix.push({ id: genId(), name, categoryId, value, obs, isFixed, ts: now, updatedAt: now });
  }
  save(); closePixModal(); renderAll();
}

function deletePix(id) {

  month.pix = month.pix.filter(p => p.id !== id);
  save(); renderAll();
}

  currentMonth = data.months.length ? data.months[data.months.length-1].id : null;
  save(); renderAll();
}

// ===== EXPORTAR / IMPORTAR =====
function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toLocaleDateString('pt-BR').replace(/\//g, '-');
  a.href = url;
  a.download = `controle_grana_${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData() { document.getElementById('import-file').click(); }

function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const imported = JSON.parse(e.target.result);
      if (!imported.months || !Array.isArray(imported.months)) return alert('Arquivo inválido.');
      if (!confirm(`Importar ${imported.months.length} mês(es)? Os dados atuais serão substituídos.`)) return;
      data = imported;
      
      if (!data.categories) {
        data.categories = [
          { id: 'c1', name: 'Contas Fixas', color: '#ff4d6a' }, { id: 'c2', name: 'Supermercado', color: '#00d4aa' },
          { id: 'c3', name: 'Lazer / Saídas', color: '#7c5cfc' }, { id: 'c4', name: 'Transporte', color: '#ffb547' }
        ];
      }
      
      currentMonth = data.months.length ? data.months[data.months.length-1].id : null;
      save(); renderAll();
    } catch { alert('Erro ao ler o arquivo.'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ===== INIT & MÁSCARAS =====
document.querySelectorAll('.money-input-mask').forEach(el => {
  el.addEventListener('input', function(e) {
    let val = e.target.value.replace(/\D/g, '');
    if(!val) { e.target.value = ''; return; }
    e.target.value = (Number(val)/100).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
  });
});

if (data.months.length) currentMonth = data.months[data.months.length-1].id;
renderAll();
