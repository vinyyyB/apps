<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#DCE0D9; --surface:#F6F7F3; --tab:#CFD4CC; --line:#C2C8BE;
    --ink:#16211F; --dim:#33414A; --mute:#6E776F;
    --green:#4F8A5B; --clay:#A34B36;
    --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 18px 70px}

  /* topo */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .left{display:flex;align-items:center;gap:11px;min-width:0}
  .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  button{font-family:var(--mono);cursor:pointer;border-radius:2px}
  .burger{background:transparent;border:1px solid var(--line);color:var(--dim);font-size:14px;line-height:1;padding:6px 9px}
  .burger:hover{border-color:var(--dim)}
  .brand{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:600;padding:2px 4px;border-radius:2px;outline:none}
  .brand[contenteditable=true]:focus{background:#fff;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
  .btn{font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:transparent;border:1px solid var(--line);color:var(--dim);padding:6px 11px}
  .btn:hover{border-color:var(--dim)}
  .btn.solid{background:var(--ink);border-color:var(--ink);color:#EFF2EC}

  /* abas */
  .tabs{display:flex;gap:4px;align-items:flex-end;margin:16px 0 0;overflow-x:auto;scrollbar-width:thin;padding-bottom:1px}
  .tabs::-webkit-scrollbar{height:5px}
  .tabs::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .tab{flex:0 0 auto;font-family:var(--mono);font-size:12.5px;letter-spacing:.03em;background:var(--tab);border:1px solid var(--line);border-bottom:0;color:var(--dim);padding:9px 15px;border-radius:4px 4px 0 0;white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 -2px 0 var(--clay) inset}
  .tab .tag{color:var(--green);font-size:11px;margin-left:8px}

  /* matérias */
  .sheet{background:var(--surface);border:1px solid var(--line);padding:12px 14px;margin-bottom:20px}
  .slist{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .sitem{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:2px;padding:4px 6px}
  .sname{font-size:13px;min-width:30px;padding:1px 3px;outline:none;border-radius:2px}
  .sname:focus{background:#F0F2ED}
  input[type=color]{-webkit-appearance:none;appearance:none;width:15px;height:15px;padding:0;border:0;background:transparent;cursor:pointer;flex:0 0 auto}
  input[type=color]::-webkit-color-swatch-wrapper{padding:0}
  input[type=color]::-webkit-color-swatch{border:1px solid rgba(0,0,0,.2);border-radius:50%}
  input[type=color]::-moz-color-swatch{border:1px solid rgba(0,0,0,.2);border-radius:50%}
  .x{background:transparent;border:0;color:#AEB6AD;font-family:var(--mono);font-size:15px;line-height:1;padding:0 2px;cursor:pointer}
  .x:hover{color:var(--clay)}

  /* colunas / dias */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;align-items:start}
  .grid.board{display:flex;flex-wrap:wrap;align-items:flex-start}
  .grid.board .day{resize:both;overflow:auto;min-width:190px;min-height:110px;max-width:100%}
  .grid.board .day::-webkit-scrollbar{width:6px;height:6px}
  .grid.board .day::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .grid.board .newcol{flex:0 0 auto;width:180px}
  .ptop{display:flex;align-items:flex-start;gap:8px}
  .ptop .txt{flex:1 1 auto;min-width:0;margin-top:0}
  .prio{flex:0 0 auto;width:13px;height:13px;margin-top:4px;padding:0;border:1.5px solid var(--line);border-radius:3px;background:transparent;cursor:pointer}
  .prio:hover{border-color:var(--dim)}
  .grip{flex:0 0 auto;background:none;border:0;color:#C3CABF;font-size:12px;line-height:1;padding:3px 1px 0;cursor:grab;opacity:0;transition:opacity .12s;touch-action:none}
  .row:hover .grip,.grip:focus{opacity:1}
  @media (hover:none){ .grip{opacity:.55;padding:3px 5px 0;font-size:14px} }
  .fantasma{position:fixed;z-index:60;pointer-events:none;margin:0;list-style:none;
            background:var(--surface);border:1px solid var(--line);border-radius:2px;
            padding:6px 8px;box-shadow:0 8px 20px rgba(22,33,31,.28);opacity:.96}
  .row.dragging{opacity:.35}
  .row.over-top{box-shadow:0 -2px 0 0 var(--clay)}
  .row.over-bottom{box-shadow:0 2px 0 0 var(--clay)}
  ul.rows{min-height:24px}
  ul.rows.over{background:rgba(79,138,91,.10);border-radius:2px}
  .day{background:var(--surface);border:1px solid var(--line);padding:12px 13px;display:flex;flex-direction:column}
  .dh{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
  .dh .dt{color:#AEB6AD;letter-spacing:.04em;font-weight:400}
  .dh .cn{outline:none;padding:1px 3px;border-radius:2px;flex:1 1 auto;min-width:0}
  .dh .cn:focus{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
  .day.today{border-color:#D3B3A8}
  .day.today .dh{color:var(--clay)}
  .rows{list-style:none;margin:0;padding:0;flex:1 1 auto}
  .row{display:flex;align-items:flex-start;gap:7px;padding:6px 0;border-top:1px dashed var(--line)}
  .row:first-child{border-top:0}
  .cb{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:15px;height:15px;margin:3px 0 0;border:1.5px solid var(--dim);border-radius:2px;cursor:pointer;position:relative;background:transparent}
  .cb:checked{background:var(--green);border-color:var(--green)}
  .cb:checked::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
  .body{flex:1 1 auto;min-width:0}
  .pick{font-family:var(--mono);font-size:10px;letter-spacing:.05em;border:0;border-radius:2px;padding:2px 5px;color:#fff;max-width:100%;cursor:pointer;appearance:none;-webkit-appearance:none}
  .txt{font-size:13.5px;padding:1px 3px;margin-top:3px;outline:none;border-radius:2px;word-break:break-word;min-height:19px}
  .txt:focus{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
  .txt:empty::before{content:"anotação";color:#B4BBB3}
  .row.done .txt,.row.done .pick{opacity:.45;text-decoration:line-through}
  .add{margin-top:9px;background:transparent;border:1px dashed var(--line);color:var(--mute);padding:6px 0;width:100%;font-size:12px}
  .add:hover{border-color:var(--green);color:var(--green)}
  .newcol{background:transparent;border:1px dashed var(--line);color:var(--mute);min-height:64px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
  .newcol:hover{border-color:var(--green);color:var(--green)}

  /* drawer */
  .veil{position:fixed;inset:0;background:rgba(22,33,31,.45);z-index:20;opacity:0;pointer-events:none;transition:opacity .18s ease}
  .veil.on{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:88vw;background:var(--surface);border-right:1px solid var(--line);z-index:21;display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .2s ease}
  .drawer.on{transform:none}
  .dhd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);flex:0 0 auto}
  .nav{display:flex;flex:0 0 auto;border-bottom:1px solid var(--line)}
  .nav button{flex:1 1 0;background:transparent;border:0;border-right:1px solid var(--line);padding:12px 8px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
  .nav button:last-child{border-right:0}
  .nav button.on{background:var(--ink);color:#EFF2EC;font-weight:600}
  .dbody{overflow-y:auto;flex:1 1 auto;padding-bottom:16px}
  .group{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#A6AEA6;padding:16px 16px 7px}
  .wrow{display:flex;align-items:center;gap:6px;padding:8px 12px 8px 16px;border-bottom:1px solid #E2E5DE}
  .wrow.on{background:#E7EAE3;box-shadow:2px 0 0 var(--clay) inset}
  .wrow.on .lb{font-weight:600}
  .lb{flex:1 1 auto;text-align:left;background:none;border:0;padding:0;font-family:var(--mono);font-size:13px;color:var(--ink);cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lb .tag{color:var(--green);font-size:11px;margin-left:7px}
  .act{background:none;border:0;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#9AA39B;padding:2px 4px;cursor:pointer}
  .act:hover{color:var(--dim)}
  .empty{padding:4px 16px 12px;font-size:12px;color:#A6AEA6;font-family:var(--mono)}
  :focus-visible{outline:2px solid #C77D31;outline-offset:2px}

  /* aviso de sincronia */
  .sinal{position:fixed;left:16px;bottom:16px;z-index:30;font-family:var(--mono);font-size:11px;letter-spacing:.06em;
         background:var(--ink);color:#EFF2EC;padding:7px 12px;border-radius:2px;opacity:0;transition:opacity .18s;pointer-events:none}
  .sinal.on{opacity:1}
  .sinal.erro{background:var(--clay)}
</style>
</head>
<body>

<div class="wrap">
  <div class="bar">
    <div class="left">
      <button class="burger" id="open" aria-label="Menu">☰</button>
      <span class="brand" id="brand">Semana</span>
    </div>
    <div class="tools">
      <button class="btn" id="import">Importar</button>
      <button class="btn" id="export">Exportar</button>
      <button class="btn solid" id="new"></button>
    </div>
  </div>
  <input type="file" id="file" accept="application/json,.json" hidden>

  <div class="tabs" id="tabs"></div>

  <div class="sheet">
    <div class="slist" id="slist"></div>
    <button class="btn solid" id="addsub" style="margin-top:10px">+ matéria</button>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="veil" id="veil"></div>
<aside class="drawer" id="drawer">
  <div class="dhd"><span id="dtitle">Semanas</span><button class="x" id="closed">×</button></div>
  <div class="nav">
    <button id="navW">Semana</button>
    <button id="navB">Pendências</button>
  </div>
  <div class="dbody" id="dbody"></div>
</aside>

<div class="sinal" id="sinal"></div>

<script>
/* ---- sincronia entre aparelhos ---- */
/* sync.js — sincronia entre aparelhos para apps HTML de uma página só.
 *
 * Como usar, dentro do seu app:
 *
 *   const sync = criaSync({
 *     app: 'financas',            // vira o caminho no servidor: /financas
 *     chave: 'financas:v1',       // onde guarda no navegador
 *     ler:     ()      => estado, // devolve o objeto que você quer salvar
 *     aplicar: (novo)  => { estado = novo; render(); },
 *     aviso:   (tipo,msg) => console.log(tipo, msg)   // opcional
 *   });
 *
 *   estado = sync.carregar() || estadoInicial();   // ao abrir
 *   await sync.iniciar();                          // lê link e puxa do servidor
 *   ...
 *   sync.salvar();   // chame depois de QUALQUER alteração
 *
 * Para ligar: sync.configurar('https://SEU-WORKER.workers.dev', 'seu-codigo')
 * A configuração é compartilhada por todos os apps do mesmo domínio —
 * configurou num, valeu pra todos.
 */

function criaSync(cfg) {
  const CONF = 'sync:conf';          // endereço + código, comum a todos os apps
  const avisa = (t, m) => { try { cfg.aviso && cfg.aviso(t, m); } catch (e) {} };

  const lerLocal = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const gravarLocal = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };

  const conf = () => { try { return JSON.parse(lerLocal(CONF) || '{}'); } catch (e) { return {}; } };
  const ativo = () => { const c = conf(); return !!(c.url && c.codigo); };
  const endereco = () => conf().url.replace(/\/+$/, '') + '/' + cfg.app;

  let empurrando = null, sincronizando = false;

  /* --- envelope: seus dados + o carimbo de hora --- */
  const embrulha = dados => JSON.stringify({ _v: 1, _atualizado: Date.now(), dados });
  function desembrulha(txt) {
    try {
      const o = JSON.parse(txt);
      if (o && o._v === 1 && 'dados' in o) return o;
      return null;
    } catch (e) { return null; }
  }
  const quando = () => { const o = desembrulha(lerLocal(cfg.chave) || ''); return o ? o._atualizado : 0; };

  /* --- link do tipo  #sync=<base64>  --- */
  function empacota(url, codigo) {
    return btoa(unescape(encodeURIComponent(url + '|' + codigo))).replace(/=+$/, '');
  }
  function leLink() {
    const m = (location.hash || '').match(/^#sync=(.+)$/);
    if (!m) return null;
    try {
      const txt = decodeURIComponent(escape(atob(decodeURIComponent(m[1]))));
      const i = txt.indexOf('|');
      const url = txt.slice(0, i), codigo = txt.slice(i + 1);
      if (url && codigo) return { url, codigo };
    } catch (e) {}
    return null;
  }

  const api = {
    ativo,
    config: conf,

    configurar(url, codigo) {
      if (url && codigo) gravarLocal(CONF, JSON.stringify({ url: url.replace(/\/+$/, ''), codigo }));
      else gravarLocal(CONF, '{}');
      return ativo();
    },

    /* link que já entra configurado em outro aparelho ou pra outra pessoa */
    link(codigo) {
      const c = conf();
      if (!c.url) return '';
      return location.origin + location.pathname + '#sync=' + empacota(c.url, codigo || c.codigo);
    },

    /* Lê o que está guardado neste aparelho.
       Se encontrar dado no formato antigo (sem carimbo de hora), adota e
       carimba na hora — senão ele nunca ganharia do servidor vazio. */
    carregar() {
      const raw = lerLocal(cfg.chave);
      if (!raw) return null;
      const o = desembrulha(raw);
      if (o) return o.dados;
      try {
        const legado = JSON.parse(raw);
        if (legado && typeof legado === 'object') {
          gravarLocal(cfg.chave, embrulha(legado));
          return legado;
        }
      } catch (e) {}
      return null;
    },

    /* Grava sem mexer no carimbo de hora. É pra arrumação de abertura
       (criar a semana atual, escolher um quadro padrão) — não é alteração
       de verdade e não pode vencer o que está no servidor. */
    salvarQuieto() {
      gravarLocal(cfg.chave, JSON.stringify({ _v: 1, _atualizado: quando(), dados: cfg.ler() }));
    },

    salvar() {
      const ok = gravarLocal(cfg.chave, embrulha(cfg.ler()));
      if (!ok) avisa('erro', 'este navegador não guardou os dados');
      if (ativo()) { clearTimeout(empurrando); empurrando = setTimeout(api.empurrar, 1800); }
      return ok;
    },

    async empurrar() {
      if (!ativo()) return false;
      avisa('indo', 'enviando');
      try {
        const r = await fetch(endereco(), {
          method: 'PUT',
          headers: { 'content-type': 'application/json', 'x-codigo': conf().codigo },
          body: lerLocal(cfg.chave)
        });
        if (r.status === 401) { avisa('erro', 'código recusado'); return false; }
        if (!r.ok) throw 0;
        avisa('ok', 'sincronizado');
        return true;
      } catch (e) { avisa('erro', 'sem conexão'); return false; }
    },

    async sincroniza() {
      if (!ativo() || sincronizando) return;
      sincronizando = true;
      avisa('indo', 'sincronizando');
      try {
        const r = await fetch(endereco(), { headers: { 'x-codigo': conf().codigo }, cache: 'no-store' });
        if (r.status === 401) { avisa('erro', 'código recusado'); return; }
        if (!r.ok) throw 0;
        const remoto = desembrulha(await r.text());
        const meu = quando();
        if (remoto && remoto._atualizado > meu) {
          gravarLocal(cfg.chave, JSON.stringify(remoto));
          cfg.aplicar(remoto.dados);
          avisa('ok', 'trouxe do servidor');
        } else if (meu > (remoto ? remoto._atualizado : 0)) {
          await api.empurrar();
        } else {
          avisa('ok', 'tudo em dia');
        }
      } catch (e) { avisa('erro', 'servidor fora do ar'); }
      finally { sincronizando = false; }
    },

    /* chame uma vez, ao abrir */
    async iniciar() {
      const convite = leLink();
      if (convite) {
        api.configurar(convite.url, convite.codigo);
        try { history.replaceState(null, '', location.pathname + location.search); }
        catch (e) { location.hash = ''; }
        avisa('ok', 'sincronia configurada');
      }
      if (!ativo()) { avisa('erro', 'sincronia não configurada — abra /apps/'); return; }
      addEventListener('online', () => api.sincroniza());
      document.addEventListener('visibilitychange', () => { if (!document.hidden) api.sincroniza(); });
      addEventListener('pagehide', () => { if (ativo()) api.empurrar(); });
      await api.sincroniza();
    }
  };

  return api;
}

</script>
<script>
(function(){
  var KEY="semana:v7";
  var MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  var DAYS=[["seg","Segunda"],["ter","Terça"],["qua","Quarta"],["qui","Quinta"],["sex","Sexta"],["sab","Sábado"],["dom","Domingo"]];

  function pad(n){ return n<10?"0"+n:""+n }
  function mondayOf(d){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); var w=x.getDay(); x.setDate(x.getDate()+(w===0?-6:1-w)); return x }
  function kOf(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()) }
  function dOf(k){ var p=k.split("-"); return new Date(+p[0],+p[1]-1,+p[2]) }
  function labelOf(k){
    var a=dOf(k), b=new Date(a); b.setDate(b.getDate()+6);
    return a.getMonth()===b.getMonth()
      ? a.getDate()+"–"+b.getDate()+" "+MES[a.getMonth()]
      : a.getDate()+" "+MES[a.getMonth()]+" – "+b.getDate()+" "+MES[b.getMonth()];
  }
  var TODAY_K=kOf(mondayOf(new Date()));
  var TODAY_I=(new Date().getDay()+6)%7;
  function u(){ return "x"+Math.random().toString(36).slice(2,8) }

  var PRIOS={r:"#B23B2E",o:"#D07C2A",y:"#C9A227",g:"#4F8A5B"};
  var PORDER=[null,"r","o","y","g"];

  var DRAG=null;

  /* ---------- arrastar no toque (o Safari do iPhone não tem drag nativo) ---------- */
  var TOQUE=null;
  document.addEventListener('touchmove',function(e){ if(TOQUE) e.preventDefault() },{passive:false});

  function toqueInicia(li,x,y){
    var b=li.getBoundingClientRect();
    var g=li.cloneNode(true);
    g.className='fantasma';
    g.style.left=b.left+'px'; g.style.top=b.top+'px'; g.style.width=b.width+'px';
    document.body.appendChild(g);
    TOQUE={li:li,arr:li._arr,r:li._r,ghost:g,dx:x-b.left,dy:y-b.top,alvo:null};
    li.classList.add('dragging');
    document.body.style.overflow='hidden';
    if(navigator.vibrate) navigator.vibrate(8);
  }
  function toqueMove(x,y){
    if(!TOQUE) return;
    TOQUE.ghost.style.left=(x-TOQUE.dx)+'px';
    TOQUE.ghost.style.top=(y-TOQUE.dy)+'px';
    clearMarks();
    TOQUE.alvo=null;
    var el=document.elementFromPoint(x,y);
    if(!el||!el.closest) return;
    var row=el.closest('.row'), ul=el.closest('ul.rows');
    if(row && row!==TOQUE.li && row._arr){
      var b=row.getBoundingClientRect(), depois=(y-b.top)>b.height/2;
      row.classList.add(depois?'over-bottom':'over-top');
      TOQUE.alvo={arr:row._arr,i:row._arr.indexOf(row._r)+(depois?1:0)};
    } else if(ul && ul._arr){
      ul.classList.add('over');
      TOQUE.alvo={arr:ul._arr,i:ul._arr.length};
    }
  }
  function toqueSolta(){
    if(!TOQUE) return;
    var alvo=TOQUE.alvo, arr=TOQUE.arr, r=TOQUE.r, li=TOQUE.li, g=TOQUE.ghost;
    TOQUE=null;
    g.remove(); li.classList.remove('dragging');
    document.body.style.overflow='';
    clearMarks();
    if(alvo) moveItem(arr,r,alvo.arr,alvo.i);
  }
  function ligaToque(li){
    li.addEventListener('pointerdown',function(ev){
      if(ev.pointerType==='mouse' || TOQUE) return;      // mouse segue no drag nativo
      var noGrip=!!(ev.target.closest && ev.target.closest('.grip'));
      var alvoTexto=!!(ev.target.closest && ev.target.closest('.txt,.pick,.cb,.x'));
      if(alvoTexto && !noGrip) return;                    // editar e marcar continuam normais
      var x0=ev.clientX, y0=ev.clientY, pid=ev.pointerId, espera=null, comecou=false;

      var comeca=function(){ comecou=true; toqueInicia(li,x0,y0) };
      var anda=function(e){
        if(e.pointerId!==pid) return;
        if(!comecou){
          if(Math.abs(e.clientX-x0)>10||Math.abs(e.clientY-y0)>10){ clearTimeout(espera); limpa() }
          return;
        }
        toqueMove(e.clientX,e.clientY);
      };
      var sobe=function(e){
        if(e.pointerId!==pid) return;
        clearTimeout(espera);
        if(comecou) toqueSolta();
        limpa();
      };
      var limpa=function(){
        document.removeEventListener('pointermove',anda);
        document.removeEventListener('pointerup',sobe);
        document.removeEventListener('pointercancel',sobe);
      };
      document.addEventListener('pointermove',anda);
      document.addEventListener('pointerup',sobe);
      document.addEventListener('pointercancel',sobe);

      if(noGrip){ ev.preventDefault(); comeca() }
      else espera=setTimeout(comeca,380);
    });
  }

    li.addEventListener('dragleave',function(){ li.classList.remove('over-top','over-bottom') });
    li.addEventListener('drop',function(e){

      var b=li.getBoundingClientRect(), after=(e.clientY-b.top)>b.height/2;
      moveItem(DRAG.arr,DRAG.r,arr,arr.indexOf(r)+(after?1:0));

  function resizable(card,getter,setter){

        var w=card.offsetWidth, h=card.offsetHeight, cur=getter();
        if(w!==cur.w || h!==cur.h){ setter(w,h); save() }
      },250);
    }).observe(card);
  }

    var lb=document.createElement('button'); lb.className='lb';

  function renderDrawer(){
    dbody.innerHTML='';
    var live,arch;

    if(state.view==='semana'){
      live=liveKeys(); arch=allKeys().filter(function(k){ return state.weeks[k].arch });
      var mk=function(k,archived){
        return drawerRow(labelOf(k), k===state.active, archived,
          function(){ if(archived) state.weeks[k].arch=false; state.active=k; paint(); closeD(); save() },
          function(){
            if(!archived && liveKeys().length<2){ alert('Precisa sobrar pelo menos uma semana ativa.'); return }
            state.weeks[k].arch=!archived;
            if(!archived && state.active===k) state.active=liveKeys()[liveKeys().length-1];
            paint(); renderDrawer(); save();
          },
          function(){
            if(allKeys().length<2){ alert('Precisa sobrar pelo menos uma semana.'); return }
            if(!confirm('Apagar a semana de '+labelOf(k)+'?')) return;
            delete state.weeks[k];
            if(state.active===k) state.active=liveKeys()[liveKeys().length-1]||allKeys()[0];
            paint(); renderDrawer(); save();
          },
          k===TODAY_K?'hoje':null);
      };
      addGroup('Ativas',live,function(k){ return mk(k,false) });
      addGroup('Arquivadas',arch,function(k){ return mk(k,true) });
    } else {
      live=liveBoards(); arch=state.boards.filter(function(b){ return b.arch });
      var mb=function(bd,archived){
        return drawerRow(bd.name, bd.id===state.board, archived,
          function(){ if(archived) bd.arch=false; state.board=bd.id; paint(); closeD(); save() },
          function(){
            if(!archived && liveBoards().length<2){ alert('Precisa sobrar pelo menos uma lista ativa.'); return }
            bd.arch=!archived;
            if(!archived && state.board===bd.id) state.board=liveBoards()[0].id;
            paint(); renderDrawer(); save();
          },
          function(){
            if(state.boards.length<2){ alert('Precisa sobrar pelo menos uma lista.'); return }
            if(!confirm('Apagar a lista "'+bd.name+'" e tudo dentro dela?')) return;
            state.boards=state.boards.filter(function(o){ return o.id!==bd.id });
            if(state.board===bd.id) state.board=(liveBoards()[0]||state.boards[0]).id;
            paint(); renderDrawer(); save();
          }, null);
      };
      addGroup('Ativas',live,function(bd){ return mb(bd,false) });
      addGroup('Arquivadas',arch,function(bd){ return mb(bd,true) });
    }
  }

  (function(){
    var p=sync.carregar();
    if(p){
      if(p.subjects) state.subjects=p.subjects;
      if(p.weeks) state.weeks=p.weeks;

    if(!board()) state.board=(liveBoards()[0]||state.boards[0]).id;
